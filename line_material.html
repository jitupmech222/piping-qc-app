<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTO Update Console | Admin</title>
  <script src="security-lock.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #7c3aed;
      --navy: #0f172a;
      --card-bg: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text-main: #0f172a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .top-navbar {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(10px);
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .btn-back {
      background: #ffffff;
      color: var(--navy);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-back:hover { background: #f1f5f9; color: var(--primary); }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 40px auto;
      padding: 12px 16px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      text-align: center;
    }

    .btn-mto {
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-mto:hover {
      background: #6d28d9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-navbar">
    <div style="font-size: 15px; font-weight: 700; display:flex; align-items:center; gap:8px;">
      <span>📦 MTO UPDATE CONSOLE (ADMIN)</span>
    </div>
    <a href="index.htm" class="btn-back">⬅️ Back to Console</a>
  </div>

  <div class="container">
    <div class="card">
      <h3 style="margin-top:0; font-size:18px; color:#0f172a;">MTO Entry & Update</h3>
      <p style="color:#64748b; font-size:13.5px; margin-bottom:20px;">
        Line List અને SAP Code મોડ્યુલ્સને અલગ કરી Data સેક્શનમાં ખસેડેલ છે. નીચેના બટન પર ક્લિક કરીને MTO Update મોડ્યુલ ઓપન કરી શકો છો.
      </p>

      <a href="mto_update_entry.html" class="btn-mto">
        📦 Open MTO Update Entry ➔
      </a>
    </div>
  </div>

  <script>
    function verifyAdminAccess() {
      const sessionData = sessionStorage.getItem('piping_app_auth');
      if (!sessionData) {
        alert("⚠️ કૃપા કરીને પહેલા Login કરો!");
        window.location.href = 'index.html';
        return false;
      }
      const user = JSON.parse(sessionData);
      if (user.username !== 'admin') {
        alert("⚠️ માત્ર Admin પાસે જ આ પેજ જોવાની પરમિશન છે!");
        window.location.href = 'index.html';
        return false;
      }
      return true;
    }

    window.addEventListener('DOMContentLoaded', verifyAdminAccess);
  </script>
</body>
</html>
