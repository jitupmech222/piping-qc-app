<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piping Work Progress Console</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Login Modal -->
<div id="loginOverlay">
  <div class="login-box">
    <div style="text-align: center; margin-bottom: 16px;">
      <h3 style="margin: 0; border: none; font-size: 18px;">🔐 User Login</h3>
      <span style="font-size: 12px; color: #64748b;">Piping Console</span>
    </div>
    <div>
      <label>Select User:</label>
      <select id="loginUser">
        <option value="admin">Admin</option>
        <option value="bending">Bending</option>
        <option value="fitup">Fit-up</option>
        <option value="welding">Welding</option>
        <option value="qc/dc">QC/DC</option>
        <option value="viewer">Viewer</option>
      </select>
    </div>
    <div>
      <label>Password:</label>
      <input type="password" id="loginPass" placeholder="Enter password">
    </div>
    <div id="loginError" style="color: #dc2626; font-size: 12px; font-weight: bold; margin-top: 8px; display: none; text-align: center;">
      ⚠️ Invalid Password!
    </div>
    <button type="button" class="btn-login" id="btnLogin">Login</button>
  </div>
</div>

<!-- Main App Root -->
<div id="appContent" style="display: none;">
  <div class="top-navbar">
    <div class="top-nav-title">
      <span>⚙️ PIPING CONSOLE</span>
      <span id="navSubTitle" style="font-size: 12.5px; font-weight: normal; color: #94a3b8;">| Progress Tracking</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button type="button" id="btnTopDashboard" class="btn-nav-dashboard" style="display: none;">🖥️ Dashboard</button>
      <button type="button" class="btn-logout" id="btnLogout">🚪 Logout</button>
    </div>
  </div>

  <div class="container" id="appView"></div>
</div>

<!-- Excel Filter Floating Modal -->
<div id="excelFilterPopup">
  <input type="text" id="popupSearchInput" class="popup-search" placeholder="Search...">
  <div class="popup-item" style="border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 4px;">
    <input type="checkbox" id="popupSelectAll">
    <label for="popupSelectAll" style="font-size: 12px; font-weight: bold; margin: 0; cursor: pointer;">(Select All)</label>
  </div>
  <div id="popupOptionsList" class="popup-options-list"></div>
  <div class="popup-actions">
    <button type="button" class="popup-btn-ok" id="btnPopupOk">OK</button>
    <button type="button" class="popup-btn-clear" id="btnPopupClear">Clear</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
