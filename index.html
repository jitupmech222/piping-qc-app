<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piping QC</title>
  <style>
    body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-bottom: 20px; }
    h2, h3 { color: #1e3a8a; text-align: center; margin-top: 0; }
    label { font-weight: bold; font-size: 13px; color: #333; margin-top: 10px; display: block; }
    input, select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-save { background: #2563eb; color: white; }
    .btn-pdf { background: #059669; color: white; }
    .msg { margin-top: 10px; font-weight: bold; text-align: center; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <div>
    <div class="card">
      <h2>🛠️ Piping Joint Data Entry</h2>
      <form id="jointForm">
        <label>Line Number (લાઈન નંબર):</label>
        <input type="text" id="line_no" placeholder="ઉદા. L-101" required>

        <label>Spool ID (સ્પૂલ ID):</label>
        <input type="text" id="spool_no" placeholder="ઉદા. SP-01" required>

        <label>Joint Number (જોઈન્ટ નંબર):</label>
        <input type="text" id="joint_no" placeholder="ઉદા. J-05" required>

        <label>Status (સ્ટેટસ):</label>
        <select id="status">
          <option value="Fit-Up Pending">🟡 Fit-Up Pending</option>
          <option value="Fit-Up Approved">🟢 Fit-Up Approved</option>
          <option value="Visual Inspected">🔵 Visual Inspected</option>
          <option value="NDT Cleared">🟣 NDT Cleared</option>
        </select>

        <button type="submit" class="btn-save">💾 ડેટા સેવ કરો (Save Joint)</button>
      </form>
      <div id="msgBox" class="msg"></div>
    </div>

    <div class="card">
      <h3>📄 Inspection Report Generator</h3>
      <button class="btn-pdf" onclick="window.location.href='/api/report'">📥 Daily PDF Report ડાઉનલોડ કરો</button>
    </div>
  </div>

  <script>
    document.getElementById('jointForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msgBox');
      msg.textContent = '⏳ સેવ થઈ રહ્યું છે...';
      msg.className = 'msg';

      const payload = {
        line_no: document.getElementById('line_no').value,
        spool_no: document.getElementById('spool_no').value,
        joint_no: document.getElementById('joint_no').value,
        status: document.getElementById('status').value
      };

      try {
        const res = await fetch('/api/joints', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          msg.textContent = '✅ જોઈન્ટ સફળતાપૂર્વક સેવ થઈ ગયો!';
          msg.className = 'msg success';
          document.getElementById('jointForm').reset();
        } else {
          msg.textContent = '❌ એરર: ' + data.error;
          msg.className = 'msg error';
        }
      } catch (err) {
        msg.textContent = '❌ સર્વર કનેક્શન ફેલ!';
        msg.className = 'msg error';
      }
    });
  </script>
</body>
</html>
