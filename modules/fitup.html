<div class="card active">
  <h3>Fit-up Entry</h3>
  <form id="fitupForm">
    <label>Drawing No:</label>
    <input type="text" id="fitup_drawing" placeholder="Enter Drawing No..." oninput="handleDrawingSearch()" autocomplete="off" required>
    <div id="drawingSearchResults" class="search-results"></div>

    <div id="fitupDetailsSection" style="display:none;">
      <label>Spool No:</label>
      <select id="fitup_spool" onchange="autoFillSpoolDetails()" required>
        <option value="">--- Select Spool ---</option>
      </select>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div>
          <label>Size:</label>
          <input type="text" id="fitup_spool_size" placeholder="દા.ત. 4" required>
        </div>
        <div>
          <label>Rev No:</label>
          <input type="text" id="fitup_rev_no" placeholder="દા.ત. 0" required>
        </div>
      </div>

      <div id="alreadyFilledJointsSection" style="display:none; margin-top:14px; background:#ffffff; border:1.5px solid #2563eb; border-radius:8px; padding:10px;">
        <div style="font-size:13px; font-weight:bold; color:#1e40af; margin-bottom:8px;">
          📌 Previous Filled Joint:
        </div>
        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse; background:#ffffff; font-size:12px; text-align:center; border:1px solid #94a3b8;">
            <thead>
              <tr style="background:#1e40af; color:#ffffff;">
                <th style="border:1px solid #64748b; padding:8px 6px;">Joint No</th>
                <th style="border:1px solid #64748b; padding:8px 6px;">Type of Joint</th>
                <th style="border:1px solid #64748b; padding:8px 6px;">Joint Size</th>
              </tr>
            </thead>
            <tbody id="alreadyFilledJointsTableBody"></tbody>
          </table>
        </div>
      </div>

      <div style="background:#eff6ff; border:1.5px dashed #3b82f6; border-radius:8px; padding:12px; margin-top:14px;">
        <div style="font-weight:bold; color:#1e40af; font-size:13px; margin-bottom:6px;">Fill the Joint:</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
          <div>
            <label style="font-size:11px; margin-top:0;">Joint No:</label>
            <input type="text" id="current_joint_no" placeholder="J01">
          </div>
          <div>
            <label style="font-size:11px; margin-top:0;">Type:</label>
            <select id="current_joint_type">
              <option value="">--- Select ---</option>
              <option value="BW">BW</option>
              <option value="SOB">SOB</option>
              <option value="SOF">SOF</option>
              <option value="LET">LET</option>
              <option value="EB">EB</option>
            </select>
          </div>
          <div>
            <label style="font-size:11px; margin-top:0;">Size (Inch):</label>
            <input type="text" id="current_joint_size" placeholder="4">
          </div>
        </div>
        <button type="button" class="btn-add-joint" style="margin-top:10px;" onclick="addCurrentJointToList()">➕ Add Joint</button>
      </div>

      <div id="addedJointsList" style="margin-top:12px;"></div>

      <label style="margin-top:16px; font-weight:bold; color:#1e3a8a;">📅 Fit-up date:</label>
      <input type="date" id="fitup_date" required>

      <button type="submit" class="btn-submit">💾 Save</button>
    </div>

    <a href="#menu" class="btn-back">⬅ Back</a>
  </form>
  <div id="fitupMsg" class="msg"></div>
</div>
