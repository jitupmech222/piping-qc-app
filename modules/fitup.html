<div class="card active">
  <h3>🔧 ફિટ-અપ ડેટા એન્ટ્રી (Fit-up Bulk)</h3>
  <form id="fitupForm">
    <label>૧. ડ્રોઇંગ નંબર (શોધવા માટે ટાઇપ કરો):</label>
    <input type="text" id="fitup_drawing" placeholder="🔍 દા.ત. 6713, CWR..." oninput="handleDrawingSearch()" autocomplete="off" required>
    <div id="drawingSearchResults" class="search-results"></div>

    <div id="fitupDetailsSection" style="display:none;">
      <label>૨. સ્પૂલ નંબર (Spool No):</label>
      <select id="fitup_spool" onchange="autoFillSpoolDetails()" required></select>

      <label>સ્પૂલ સાઇઝ (ઓટો-ભરાશે):</label>
      <input type="text" id="fitup_spool_size" readonly>

      <label>રીવિઝન નંબર (Rev No):</label>
      <input type="text" id="fitup_rev_no" readonly>

      <label>૩. ફિટ-અપ તારીખ (તમામ જોઈન્ટ્સ માટે):</label>
      <input type="date" id="fitup_date" required>

      <div style="background:#f8fafc; padding:10px; border:1px solid #cbd5e1; border-radius:8px; margin-top:12px;">
        <label style="margin-top:0;">જોઈન્ટ નંબર:</label>
        <input type="text" id="current_joint_no" placeholder="દા.ત. J-01">

        <label>જોઈન્ટ પ્રકાર:</label>
        <select id="current_joint_type">
          <option value="BW">BW (બટ વેલ્ડ)</option>
          <option value="SOF">SOF (સ્લિપ ઓન ફ્લેંજ)</option>
          <option value="SOB">SOB</option>
          <option value="LET">LET</option>
          <option value="SW">SW (સોકેટ વેલ્ડ)</option>
        </select>

        <label>જોઈન્ટ સાઇઝ:</label>
        <input type="text" id="current_joint_size" placeholder="દા.ત. 4 inch">

        <button type="button" class="btn-add-joint" onclick="addCurrentJointToList()">➕ જોઈન્ટ લિસ્ટમાં ઉમેરો</button>
      </div>

      <div id="addedJointsList" style="margin-top:10px;"></div>

      <button type="submit" class="btn-submit">💾 બધા ફિટ-અપ જોઈન્ટ્સ સેવ કરો</button>
    </div>

    <button type="button" class="btn-back" onclick="backToMenu()">⬅ પાછા જાઓ</button>
  </form>
  <div id="fitupMsg" class="msg"></div>
</div>
