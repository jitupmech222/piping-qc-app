<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDT / FD Pending List | QA/QC Module</title>
  <script src="security-lock.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Formatted Excel Export Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding: 18px 24px; -webkit-font-smoothing: antialiased; }

    /* Top Bar */
    .top-header {
      background: #ffffff;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-back {
      padding: 7px 16px;
      background: #ffffff;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #f1f5f9; color: #0284c7; }

    /* Mode Switch Buttons */
    .mode-switch-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-mode {
      padding: 9px 20px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      transition: all 0.2s;
    }
    .btn-mode.active-ndt {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }
    .btn-mode.active-fd {
      background: #16a34a;
      border-color: #16a34a;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
    }

    .card {
      background: #ffffff;
      padding: 18px 22px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .report-title-text {
      font-size: 16px;
      font-weight: 800;
      color: #17365d;
      letter-spacing: 0.3px;
    }

    .btn-refresh {
      padding: 9px 16px;
      background: #17365d;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-refresh:hover { background: #0f243e; }

    .btn-download-pdf {
      padding: 9px 18px;
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-download-pdf:hover { background: #b91c1c; }

    .btn-export-excel {
      padding: 9px 18px;
      background: #15803d;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(21, 128, 61, 0.2);
      transition: all 0.2s;
    }
    .btn-export-excel:hover { background: #166534; }
    .btn-export-excel:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

    /* Report Table */
    .table-container {
      overflow-x: auto;
      max-height: 68vh;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12.5px;
      min-width: 1100px;
    }
    th {
      background: #e2e8f0; /* Soft grey matching ReportLab lightgrey */
      color: #0f172a;
      border-right: 1px solid #cbd5e1;
      border-bottom: 2px solid #94a3b8;
      padding: 10px 8px;
      font-weight: 800;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      white-space: nowrap;
    }
    td {
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 10px;
      text-align: center;
      background: #ffffff;
      white-space: nowrap;
    }
    tr:nth-child(even) td { background-color: #f8fafc; }

    /* Printable Landscape Styling */
    @media print {
      body { background: #fff; padding: 0; }
      .top-header, .actions-bar, .btn-print-hide { display: none !important; }
      .card { border: none; box-shadow: none; padding: 0; margin: 0; }
      @page { size: landscape; margin: 8mm; }
      th { background: #e2e8f0 !important; color: #000 !important; -webkit-print-color-adjust: exact; }
      table { min-width: 100% !important; font-size: 9.5px !important; }
      td, th { padding: 4px 5px !important; border: 1px solid #000 !important; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-header">
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="index.htm" class="btn-back">⬅️ Back to Console</a>
      <h2 style="color:#17365d; font-size:18px; font-weight:800;">📋 NDT / FD PENDING LIST</h2>
    </div>

    <!-- Mode Selector -->
    <div class="mode-switch-group">
      <button type="button" id="btnModeNdt" class="btn-mode active-ndt" onclick="switchPendingMode('NDT')">
        ⚡ NDT PENDING LIST
      </button>
      <button type="button" id="btnModeFd" class="btn-mode" onclick="switchPendingMode('FD')">
        🚚 FD PENDING LIST
      </button>
    </div>

    <span id="navSubTitle" style="font-size:12.5px; font-weight:bold; color:#64748b;"></span>
  </div>

  <!-- Main Table Card -->
  <div class="card">
    <div class="actions-bar">
      <div>
        <span class="report-title-text" id="reportHeadingText">WELD VISUAL DONE NDT PENDING LIST</span>
        <span style="font-size:12.5px; color:#64748b; font-weight:bold; margin-left:8px;" id="countBadge">Loading...</span>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <button type="button" class="btn-refresh btn-print-hide" onclick="loadPendingListData()">🔄 Refresh</button>
        <button type="button" class="btn-download-pdf btn-print-hide" onclick="window.print()">
          <span>📄 Download / Print PDF</span>
        </button>
        <button type="button" id="btnExportExcel" class="btn-export-excel btn-print-hide" onclick="downloadPendingExcel()" disabled>
          <span>📥 Download Excel (.xlsx)</span>
        </button>
      </div>
    </div>

    <!-- Table Container (First View) -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">Sr.No</th>
            <th>ISO No / Drawing No / Line No</th>
            <th>Spool Unique No</th>
            <th>Spool Size</th>
            <th>FIT UP Date</th>
            <th>VISUAL Date</th>
            <th>WELD VISUAL REPORT NO</th>
            <th>NDT CLEARANCE</th>
            <th>Remarks</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="9" style="text-align:center; padding:30px; color:#64748b;">⏳ Reading data from lhs_entries (Safe Mode)...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://khaevpfnwpxcpzhbnooy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4DvhZ0usZv6Jeayd5TOamA_gbQQJ8mt';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentMode = "NDT";
    let reportTableData = [];
    let currentReportTitle = "WELD VISUAL DONE NDT PENDING LIST";

    function verifyAdminAccess() {
      const sessionData = sessionStorage.getItem('piping_app_auth');
      if (!sessionData) {
        alert("⚠️ કૃપા કરીને પહેલાં Login કરો!");
        window.location.href = 'index.html';
        return false;
      }
      const user = JSON.parse(sessionData);
      if (user.username !== 'admin') {
        alert("⚠️ માત્ર Admin પાસે જ આ પેજ જોવાની પરમિશન છે!");
        window.location.href = 'index.html';
        return false;
      }
      document.getElementById('navSubTitle').innerText = `| Admin: ${user.name}`;
      return true;
    }

    function cleanDate(val) {
      if (!val) return "";
      const str = String(val).trim();
      if (!str || str.toLowerCase() === "null" || str.toUpperCase() === "NA") return "";
      return str.includes("T") ? str.split("T")[0] : str;
    }

    function formatDateDisplay(val) {
      const d = cleanDate(val);
      if (!d) return "";
      const parts = d.split("-");
      if (parts.length === 3 && parts[0].length === 4) return `${parts[2]}-${parts[1]}-${parts[0]}`;
      return d;
    }

    function switchPendingMode(mode) {
      currentMode = mode;
      const btnNdt = document.getElementById('btnModeNdt');
      const btnFd = document.getElementById('btnModeFd');

      if (mode === 'NDT') {
        btnNdt.className = 'btn-mode active-ndt';
        btnFd.className = 'btn-mode';
        currentReportTitle = "WELD VISUAL DONE NDT PENDING LIST";
      } else {
        btnFd.className = 'btn-mode active-fd';
        btnNdt.className = 'btn-mode';
        currentReportTitle = "NDT DONE DISPATCH PENDING LIST";
      }

      document.getElementById('reportHeadingText').innerText = currentReportTitle;
      loadPendingListData();
    }

    /* -------------------------------------------------------------
       READ-ONLY FETCH & GROUPING LOGIC (MATCHING PYTHON)
    -------------------------------------------------------------- */
    async function loadPendingListData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#64748b;">⏳ Reading data from lhs_entries...</td></tr>`;
      document.getElementById('countBadge').innerText = "(Loading...)";
      document.getElementById('btnExportExcel').disabled = true;

      try {
        let allRows = [];
        let from = 0;
        let hasMore = true;

        while (hasMore) {
          const { data, error } = await db
            .from('lhs_entries')
            .select('drawing_no, spool_no, spool_size, fitup_date, visual_date, weld_visual_report_no, ndt_clearance, fd_date, shift_dc_no')
            .order('id', { ascending: true })
            .range(from, from + 999);

          if (error) throw error;
          if (data && data.length > 0) {
            allRows = allRows.concat(data);
            from += 1000;
            if (data.length < 1000) hasMore = false;
          } else {
            hasMore = false;
          }
        }

        // Apply Python Filtering Logic
        const filtered = allRows.filter(r => {
          const visDt = cleanDate(r.visual_date);
          const ndtClear = cleanDate(r.ndt_clearance);
          const fdDt = cleanDate(r.fd_date);
          const dcNo = String(r.shift_dc_no || '').trim();

          if (currentMode === "NDT") {
            // (visual_date not null) & (ndt_clearance is null)
            return visDt !== "" && ndtClear === "";
          } else if (currentMode === "FD") {
            // (ndt_clearance not null) & (fd_date is null) & (dc is null)
            return ndtClear !== "" && fdDt === "" && dcNo === "";
          }
          return false;
        });

        // Group by ISO No / Drawing No
        const groupMap = new Map();

        filtered.forEach(r => {
          const iso = String(r.drawing_no || '-').trim();
          if (!groupMap.has(iso)) {
            groupMap.set(iso, []);
          }
          groupMap.get(iso).push(r);
        });

        reportTableData = [];
        let sr = 1;

        groupMap.forEach((groupRows, iso) => {
          // fitup_date = max
          const fitDates = groupRows.map(x => cleanDate(x.fitup_date)).filter(Boolean).sort();
          const maxFitup = fitDates.length ? fitDates[fitDates.length - 1] : "";

          // visual_date = max
          const visDates = groupRows.map(x => cleanDate(x.visual_date)).filter(Boolean).sort();
          const maxVisual = visDates.length ? visDates[visDates.length - 1] : "";

          // ndt_clear = max
          const ndtDates = groupRows.map(x => cleanDate(x.ndt_clearance)).filter(Boolean).sort();
          const maxNdt = ndtDates.length ? ndtDates[ndtDates.length - 1] : "";

          // spool = first non-empty
          const spoolItem = groupRows.find(x => x.spool_no && String(x.spool_no).trim() !== "");
          const spool = spoolItem ? spoolItem.spool_no : "";

          // size = first non-empty
          const sizeItem = groupRows.find(x => x.spool_size && String(x.spool_size).trim() !== "");
          const size = sizeItem ? sizeItem.spool_size : "";

          // report = last non-empty
          const reports = groupRows.map(x => String(x.weld_visual_report_no || '').trim()).filter(Boolean);
          const reportNo = reports.length ? reports[reports.length - 1] : "";

          reportTableData.push({
            sr: sr++,
            iso: iso,
            spool: spool,
            size: size,
            fitup: formatDateDisplay(maxFitup),
            visual: formatDateDisplay(maxVisual),
            report: reportNo,
            ndtClear: formatDateDisplay(maxNdt),
            remarks: ""
          });
        });

        renderTable();
        document.getElementById('countBadge').innerText = `(${reportTableData.length} Drawings Pending)`;
        document.getElementById('btnExportExcel').disabled = reportTableData.length === 0;

      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:20px; color:#dc2626;">❌ Error: ${err.message}</td></tr>`;
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      if (reportTableData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#15803d; font-weight:bold;">🎉 No Pending Records Found!</td></tr>`;
        return;
      }

      tbody.innerHTML = reportTableData.map(r => `
        <tr>
          <td>${r.sr}</td>
          <td style="text-align:left; font-weight:700;">${r.iso}</td>
          <td style="font-weight:700; color:#0284c7;">${r.spool || '-'}</td>
          <td>${r.size || '-'}</td>
          <td>${r.fitup || '-'}</td>
          <td>${r.visual || '-'}</td>
          <td>${r.report || '-'}</td>
          <td style="color:${r.ndtClear ? '#16a34a' : '#64748b'}; font-weight:${r.ndtClear ? '700' : 'normal'};">${r.ndtClear || '-'}</td>
          <td>${r.remarks}</td>
        </tr>
      `).join('');
    }

    /* -------------------------------------------------------------
       EXCEL EXPORT (MATCHING OPENPYXL SCRIPT)
    -------------------------------------------------------------- */
    async function downloadPendingExcel() {
      if (reportTableData.length === 0) return;

      const workbook = new ExcelJS.Workbook();
      const worksheet = workbook.addWorksheet('Report', {
        views: [{ state: 'frozen', ySplit: 1, showGridLines: true }]
      });

      const headers = [
        "Sr.No",
        "ISO No / Drawing No / Line No",
        "Spool Unique No",
        "Spool Size",
        "FIT UP Date",
        "VISUAL Date",
        "WELD VISUAL REPORT NO",
        "NDT CLEARANCE",
        "Remarks"
      ];

      const headerRow = worksheet.addRow(headers);
      headerRow.height = 26;

      headerRow.eachCell(cell => {
        cell.font = { name: 'Calibri', size: 11, bold: true };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD3D3D3' } }; // Light grey matching openpyxl
        cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
      });

      reportTableData.forEach(r => {
        const row = worksheet.addRow([r.sr, r.iso, r.spool, r.size, r.fitup, r.visual, r.report, r.ndtClear, r.remarks]);
        row.height = 20;
        row.eachCell((cell, colNum) => {
          cell.alignment = { horizontal: 'center', vertical: 'middle' };
          cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
          if (colNum === 2) {
            cell.alignment = { horizontal: 'left', vertical: 'middle' };
          }
        });
      });

      // Auto width
      worksheet.columns.forEach((col, idx) => {
        let maxLen = headers[idx].length;
        reportTableData.forEach(r => {
          const val = Object.values(r)[idx];
          if (val) maxLen = Math.max(maxLen, String(val).length);
        });
        col.width = maxLen + 4;
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const link = document.createElement('a');
      const today = new Date().toISOString().split('T')[0];
      link.href = URL.createObjectURL(blob);
      link.download = `${currentReportTitle} - ${today}.xlsx`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (verifyAdminAccess()) {
        loadPendingListData();
      }
    });
  </script>
</body>
</html>
