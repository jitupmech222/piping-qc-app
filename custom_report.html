<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Report Builder | Piping Console</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
    :root {
      --navy: #0b1329;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --teal: #0d9488;
      --purple: #7c3aed;
      --green: #15803d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: #f1f5f9;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP NAVBAR */
    .top-navbar {
      background: var(--navy);
      color: #ffffff;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    .top-navbar-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back {
      background: #ffffff;
      color: var(--navy);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #f8fafc; color: var(--primary); }

    /* WORKSPACE */
    .full-workspace {
      flex: 1;
      width: 100%;
      padding: 20px 28px;
      box-sizing: border-box;
    }

    /* SOURCE SWITCHER TABS */
    .tabs-wrapper {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      background: #ffffff;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      width: fit-content;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .tab-btn {
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid transparent;
      background: #f8fafc;
      color: var(--text-muted);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn:hover { background: #f1f5f9; color: var(--text-main); }
    .tab-btn.active-qaqc { background: #f5f3ff; color: var(--purple); border-color: #ddd6fe; box-shadow: 0 2px 8px rgba(124, 58, 237, 0.15); }
    .tab-btn.active-mech { background: #f0fdfa; color: var(--teal); border-color: #99f6e4; box-shadow: 0 2px 8px rgba(13, 148, 136, 0.15); }
    .tab-btn.active-mat { background: #f0f9ff; color: var(--primary); border-color: #bae6fd; box-shadow: 0 2px 8px rgba(2, 132, 199, 0.15); }

    /* CARD STYLING */
    .builder-card {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      padding: 20px 24px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    /* FILTERS GRID */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 7px;
      font-size: 12.5px;
      outline: none;
      background: #ffffff;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    /* COLUMN CHECKBOX GRID */
    .columns-chip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      background: #f8fafc;
      margin-bottom: 14px;
    }

    .col-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .col-chip:hover { background: #f0fdf4; border-color: #86efac; }
    .col-chip input[type="checkbox"] { width: 14px; height: 14px; margin: 0; cursor: pointer; accent-color: var(--primary); }

    /* ACTION BAR */
    .action-controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1.5px dashed var(--border);
    }

    .mode-selector {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .mode-radio {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .mode-radio input[type="radio"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--primary); }

    .btn-generate {
      padding: 10px 24px;
      background: var(--navy);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.2);
      transition: all 0.2s;
    }
    .btn-generate:hover { background: #1e293b; transform: translateY(-1px); }

    .btn-export-excel {
      padding: 10px 22px;
      background: var(--green);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 3px 10px rgba(21, 128, 61, 0.2);
      transition: all 0.2s;
    }
    .btn-export-excel:hover { background: #166534; transform: translateY(-1px); }
    .btn-export-excel:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }

    /* SUMMARY STATS BAR */
    .stats-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .stat-pill {
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      border: 1px solid #bae6fd;
    }

    /* TABLE GRID */
    .table-container {
      overflow-x: auto;
      max-height: 55vh;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
    th {
      background: #0f172a;
      color: #ffffff;
      padding: 9px 12px;
      font-weight: 700;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      white-space: nowrap;
    }
    td {
      border-bottom: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      padding: 8px 12px;
      text-align: center;
      white-space: nowrap;
      background: #ffffff;
    }
    tr:nth-child(even) td { background-color: #f8fafc; }
    tr.total-row td {
      background: #fce4d6 !important;
      color: #7c2d12;
      font-weight: 900;
      font-size: 13px;
      position: sticky;
      bottom: 0;
      border-top: 2px solid #fdba74;
    }
  </style>
</head>
<body>

  <!-- TOP NAVBAR -->
  <header class="top-navbar">
    <div class="top-navbar-title">
      <span>📊</span>
      <span>UNIVERSAL CUSTOM REPORT BUILDER</span>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span id="adminSessionTag" style="font-size:12px; color:#94a3b8; font-weight:bold;"></span>
      <a href="index.html?tab=reportHub" class="btn-back">⬅️ Back to Reports</a>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="full-workspace">

    <!-- 1. DATA SOURCE SELECTOR -->
    <div class="tabs-wrapper">
      <button type="button" class="tab-btn active-qaqc" id="tabQaqc" onclick="switchSource('qaqc')">
        <span>🛡️</span> <span>QA/QC (lhs_entries)</span>
      </button>
      <button type="button" class="tab-btn" id="tabMech" onclick="switchSource('mech')">
        <span>⚙️</span> <span>Mechanical (piping_joints)</span>
      </button>
      <button type="button" class="tab-btn" id="tabMat" onclick="switchSource('mat')">
        <span>📦</span> <span>Material (mto)</span>
      </button>
    </div>

    <!-- 2. BUILDER CONTROLS CARD -->
    <div class="builder-card">
      <div class="section-title">
        <span id="configTitle">⚙️ Step 1: Filter Conditions (QA/QC)</span>
      </div>

      <!-- DYNAMIC FILTERS CONTAINER -->
      <div class="filter-grid" id="dynamicFiltersContainer"></div>

      <!-- STEP 2: COLUMN SELECTOR -->
      <div class="section-title" style="margin-top:14px;">
        <span>📋 Step 2: Select Columns to Include</span>
        <div style="display:flex; gap:10px;">
          <button type="button" style="background:none; border:none; color:var(--primary); font-size:12px; font-weight:bold; cursor:pointer;" onclick="toggleAllColumns(true)">Select All</button>
          <span style="color:#cbd5e1;">|</span>
          <button type="button" style="background:none; border:none; color:#dc2626; font-size:12px; font-weight:bold; cursor:pointer;" onclick="toggleAllColumns(false)">Clear All</button>
          <span style="color:#cbd5e1;">|</span>
          <button type="button" style="background:none; border:none; color:#15803d; font-size:12px; font-weight:bold; cursor:pointer;" onclick="resetDefaultColumns()">Reset Default</button>
        </div>
      </div>
      <div class="columns-chip-grid" id="columnsContainer"></div>

      <!-- STEP 3: OUTPUT MODE & ACTION BUTTONS -->
      <div class="action-controls-row">
        <div class="mode-selector">
          <label class="mode-radio">
            <input type="radio" name="reportMode" value="detail" checked onchange="handleModeChange()">
            <span>Detailed Record View</span>
          </label>
          <label class="mode-radio">
            <input type="radio" name="reportMode" value="summary" onchange="handleModeChange()">
            <span>Summary / Pivot View</span>
          </label>
          <div id="groupByWrapper" style="display:none; align-items:center; gap:8px;">
            <label style="margin:0;">Group By:</label>
            <select id="selectGroupBy" style="width:160px; padding:6px 10px;"></select>
          </div>
        </div>

        <div style="display:flex; gap:12px;">
          <button type="button" class="btn-generate" id="btnGen" onclick="executeGenerateReport()">
            <span>⚡ Generate Report</span>
          </button>
          <button type="button" class="btn-export-excel" id="btnExport" onclick="exportReportToExcel()" disabled>
            <span>📥 Export to Excel (.xlsx)</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 3. REPORT OUTPUT CARD -->
    <div class="builder-card" id="outputCard" style="display:none;">
      <div class="stats-bar" id="statsBarContainer"></div>
      <div class="table-container">
        <table>
          <thead id="reportTableHead"></thead>
          <tbody id="reportTableBody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://khaevpfnwpxcpzhbnooy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4DvhZ0usZv6Jeayd5TOamA_gbQQJ8mt';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeSource = 'qaqc';
    let cachedSourceData = [];
    let generatedReportRows = [];
    let generatedHeaders = [];
    let grandSummaryMetrics = {};

    // 🟢 MODULE CONFIGURATIONS
    const CONFIGS = {

        defaultCols: ['drawing_no', 'spool_no', 'joint_no', 'joint_type', 'weld_npd', 'welder_no', 'wps_no', 'weld_inch_dia', 'weld_visual_report_no', 'visual_date', 'ndt_clearance', 'fd_date'],

          { key: 'rt_percentage', title: 'RT %' },
          { key: 'rt_report_no', title: 'RT Report No' },
          { key: 'rt_date', title: 'RT Date', isDate: true },
          { key: 'dpt_percentage', title: 'DPT %' },
          { key: 'dpt_report_no', title: 'DPT Report No' },
          { key: 'dpt_date', title: 'DPT Date', isDate: true },
          { key: 'ndt_clearance', title: 'NDT Clearance', isDate: true },
          { key: 'fd_date', title: 'FD Date', isDate: true },
          { key: 'shift_dc_no', title: 'DC No' },

        ],
        groupByOptions: [
          { key: 'drawing_no', label: 'Drawing No / Line No' },
          { key: 'welder_no', label: 'Welder No' },

        ],
        dateFields: [

          { key: 'fitup_date', label: 'Fit-Up Date' },

          { key: 'fd_date', label: 'FD Date' },
          { key: 'rt_date', label: 'RT Date' }
        ]
      },

      mech: {
        table: 'piping_joints',
        title: 'Mechanical (piping_joints)',
        defaultCols: ['Drawing_no', 'Spool_number', 'Spool_size', 'Weld_id', 'Bend_qty', 'Issued_for_bending', 'Bend_date', 'Fit_up_date', 'Weld_visual_date', 'Ndt_clearance', 'Fd_date', 'Shift_dc_no'],
        allCols: [
          { key: 'Drawing_no', title: 'Drawing No', align: 'left' },
          { key: 'Spool_number', title: 'Spool Unique No' },
          { key: 'Spool_size', title: 'Spool Size' },
          { key: 'Weld_id', title: 'Weld ID / Scope', isNum: true },
          { key: 'Bend_qty', title: 'Bend Qty', isNum: true },
          { key: 'Issued_for_bending', title: 'Issued for Bending', isDate: true },
          { key: 'Bend_date', title: 'Bend Completed', isDate: true },
          { key: 'Fit_up_date', title: 'Fit-Up Completed', isDate: true },
          { key: 'Weld_visual_date', title: 'Weld Visual Date', isDate: true },
          { key: 'Ndt_clearance', title: 'NDT Clearance', isDate: true },
          { key: 'Fd_date', title: 'Dispatch Date (FD)', isDate: true },
          { key: 'Shift_dc_no', title: 'DC Number' },
          { key: 'UNIT', title: 'Unit' },
          { key: 'Allocation', title: 'Allocation' },
          { key: 'MOC', title: 'MOC' }
        ],
        groupByOptions: [
          { key: 'Drawing_no', label: 'Drawing No' },
          { key: 'Spool_size', label: 'Spool Size' },
          { key: 'UNIT', label: 'Unit' },
          { key: 'Shift_dc_no', label: 'DC Number' }
        ],
        dateFields: [
          { key: 'Weld_visual_date', label: 'Weld Visual Date' },
          { key: 'Issued_for_bending', label: 'Bending Issue Date' },
          { key: 'Bend_date', label: 'Bend Date' },
          { key: 'Fit_up_date', label: 'Fit-Up Date' },
          { key: 'Ndt_clearance', label: 'NDT Date' },
          { key: 'Fd_date', label: 'FD Date' }
        ]
      },

      mat: {
        table: 'mto',
        title: 'Material (mto)',
        defaultCols: ['Drawing_no', 'Spool_number', 'lot_no', 'MAT_SAP_CODE', 'MAT_Description', 'MIN_No', 'MIN_qty', 'Issued_qty', 'IGP_No', 'IGP_Date'],
        allCols: [
          { key: 'Drawing_no', title: 'Drawing No', align: 'left' },
          { key: 'Spool_number', title: 'Spool Unique No' },
          { key: 'lot_no', title: 'Lot No' },
          { key: 'MAT_SAP_CODE', title: 'Material SAP Code' },

        ]

    function verifyAdminAccess() {
      const sessionData = sessionStorage.getItem('piping_app_auth');
      if (!sessionData) {
        alert("⚠️ કૃપા કરીને પહેલા Login કરો!");
        window.location.href = 'index.html';
        return false;
      }
      const user = JSON.parse(sessionData);
      if (user.username !== 'admin') {
        alert("⚠️ Access Denied: માત્ર Admin પાસે જ Custom Report ની પરમિશન છે!");
        window.location.href = 'index.html?tab=reportHub';
        return false;
      }
      document.getElementById('adminSessionTag').innerText = `Admin: ${user.name}`;
      return true;
    }

    function formatDateDisplay(val) {
      if (!val) return '-';
      const str = String(val).trim();
      if (!str || str.toLowerCase() === 'null') return '-';
      const dPart = /^\d{4}-\d{2}-\d{2}T/.test(str) ? str.split('T')[0] : str;
      const parts = dPart.split('-');
      if (parts.length === 3 && parts[0].length === 4) return `${parts[2]}-${parts[1]}-${parts[0]}`;
      return str;
    }

    function parseNum(val) {
      if (val === null || val === undefined) return 0;
      const str = String(val).replace(/[^0-9.]/g, '');
      const n = parseFloat(str);
      return isNaN(n) ? 0 : n;
    }

    // 1. SWITCH SOURCE TABS
    function switchSource(sourceKey) {
      activeSource = sourceKey;
      cachedSourceData = [];
      generatedReportRows = [];
      document.getElementById('outputCard').style.display = 'none';
      document.getElementById('btnExport').disabled = true;

      // Update Tab Styles
      document.getElementById('tabQaqc').className = `tab-btn ${sourceKey === 'qaqc' ? 'active-qaqc' : ''}`;
      document.getElementById('tabMech').className = `tab-btn ${sourceKey === 'mech' ? 'active-mech' : ''}`;
      document.getElementById('tabMat').className = `tab-btn ${sourceKey === 'mat' ? 'active-mat' : ''}`;

      document.getElementById('configTitle').innerText = `⚙️ Step 1: Filter Conditions (${CONFIGS[sourceKey].title})`;

      buildDynamicFiltersUI();
      buildColumnsSelectorUI();
      buildGroupByOptionsUI();
    }

    // 2. BUILD FILTERS UI
    function buildDynamicFiltersUI() {
      const cfg = CONFIGS[activeSource];
      const container = document.getElementById('dynamicFiltersContainer');

      let html = `
        <div>
          <label>Filter by Date Type:</label>
          <select id="filterDateField">
            ${cfg.dateFields.map(df => `<option value="${df.key}">${df.label}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Start Date:</label>
          <input type="date" id="filterStartDate">
        </div>
        <div>
          <label>End Date:</label>
          <input type="date" id="filterEndDate">
        </div>
        <div>
          <label>Drawing No / Line No (Search):</label>
          <input type="text" id="filterDrawingNo" placeholder="e.g. 401GA-401..." autocomplete="off">
        </div>
      `;

      if (activeSource === 'qaqc') {
        html += `
          <div>
            <label>Joint Type:</label>
            <select id="filterJointType">
              <option value="">-- All Types --</option>
              <option value="BW">BW</option>
              <option value="LET">LET</option>
              <option value="SOF">SOF</option>
              <option value="SOB">SOB</option>
              <option value="SW">SW</option>
              <option value="EB">EB</option>
            </select>
          </div>
          <div>
            <label>Welder No:</label>
            <input type="text" id="filterWelderNo" placeholder="e.g. 711, 853">
          </div>
          <div>
            <label>NDT Status:</label>
            <select id="filterNdtStatus">
              <option value="">-- All --</option>
              <option value="cleared">NDT Cleared Only</option>
              <option value="pending">NDT Pending Only</option>
            </select>
          </div>
        `;
      } else if (activeSource === 'mech') {
        html += `
          <div>
            <label>Dispatch Status:</label>
            <select id="filterDispStatus">
              <option value="">-- All --</option>
              <option value="dispatched">Dispatched Only (FD)</option>
              <option value="shop">Balance in Shop</option>
            </select>
          </div>
          <div>
            <label>Spool Size:</label>
            <input type="text" id="filterSpoolSize" placeholder="e.g. 2, 4, 6">
          </div>
        `;
      } else if (activeSource === 'mat') {
        html += `
          <div>
            <label>MIN No (Filter):</label>
            <input type="text" id="filterMinNo" placeholder="e.g. 11035">
          </div>
          <div>
            <label>Material SAP Code:</label>
            <input type="text" id="filterSapCode" placeholder="e.g. 3000...">
          </div>
          <div>
            <label>Balance Status:</label>
            <select id="filterMatBalance">
              <option value="">-- All --</option>
              <option value="pending">Pending Balance Only (Issued < MIN)</option>
              <option value="issued">Fully Issued</option>
            </select>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // 3. BUILD COLUMNS CHECKBOX SELECTOR
    function buildColumnsSelectorUI() {
      const cfg = CONFIGS[activeSource];
      const container = document.getElementById('columnsContainer');

      container.innerHTML = cfg.allCols.map(c => `
        <label class="col-chip">
          <input type="checkbox" value="${c.key}" ${cfg.defaultCols.includes(c.key) ? 'checked' : ''}>
          <span>${c.title}</span>
        </label>
      `).join('');
    }

    function toggleAllColumns(checked) {
      document.querySelectorAll('#columnsContainer input[type="checkbox"]').forEach(cb => cb.checked = checked);
    }

    function resetDefaultColumns() {
      const cfg = CONFIGS[activeSource];
      document.querySelectorAll('#columnsContainer input[type="checkbox"]').forEach(cb => {
        cb.checked = cfg.defaultCols.includes(cb.value);
      });
    }

    // 4. BUILD GROUP BY OPTIONS
    function buildGroupByOptionsUI() {
      const cfg = CONFIGS[activeSource];
      const sel = document.getElementById('selectGroupBy');
      sel.innerHTML = cfg.groupByOptions.map(g => `<option value="${g.key}">${g.label}</option>`).join('');
    }

    function handleModeChange() {
      const mode = document.querySelector('input[name="reportMode"]:checked').value;
      document.getElementById('groupByWrapper').style.display = mode === 'summary' ? 'inline-flex' : 'none';
    }

    // 5. FETCH SOURCE DATA FROM SUPABASE
    async function fetchSourceData() {
      const cfg = CONFIGS[activeSource];
      let rows = [];
      let from = 0;
      let hasMore = true;

      while (hasMore) {
        const { data, error } = await db
          .from(cfg.table)
          .select('*')
          .order('id', { ascending: true })
          .range(from, from + 999);

        if (error) throw error;
        if (data && data.length > 0) {
          rows = rows.concat(data);
          from += 1000;
          if (data.length < 1000) hasMore = false;
        } else {
          hasMore = false;
        }
      }
      return rows;
    }

    // 6. GENERATE REPORT LOGIC
    async function executeGenerateReport() {
      const btn = document.getElementById('btnGen');
      btn.innerText = "⏳ Fetching & Analyzing...";
      btn.disabled = true;

      try {
        if (cachedSourceData.length === 0) {
          cachedSourceData = await fetchSourceData();
        }

        const cfg = CONFIGS[activeSource];
        const dateField = document.getElementById('filterDateField').value;
        const startDate = document.getElementById('filterStartDate').value;
        const endDate = document.getElementById('filterEndDate').value;
        const dwgSearch = (document.getElementById('filterDrawingNo').value || '').trim().toLowerCase();

        // Specific filters
        const qJoint = document.getElementById('filterJointType') ? document.getElementById('filterJointType').value : '';
        const qWelder = document.getElementById('filterWelderNo') ? document.getElementById('filterWelderNo').value.trim() : '';
        const qNdt = document.getElementById('filterNdtStatus') ? document.getElementById('filterNdtStatus').value : '';

        const qDisp = document.getElementById('filterDispStatus') ? document.getElementById('filterDispStatus').value : '';
        const qSize = document.getElementById('filterSpoolSize') ? document.getElementById('filterSpoolSize').value.trim().toLowerCase() : '';

        const qMin = document.getElementById('filterMinNo') ? document.getElementById('filterMinNo').value.trim().toLowerCase() : '';
        const qSap = document.getElementById('filterSapCode') ? document.getElementById('filterSapCode').value.trim().toLowerCase() : '';
        const qMatBal = document.getElementById('filterMatBalance') ? document.getElementById('filterMatBalance').value : '';

        // Filter Rows
        let filtered = cachedSourceData.filter(r => {
          // Date Filter
          if (startDate || endDate) {
            let rowDate = r[dateField];
            if (!rowDate) return false;
            rowDate = String(rowDate).includes('T') ? rowDate.split('T')[0] : rowDate;
            if (startDate && rowDate < startDate) return false;
            if (endDate && rowDate > endDate) return false;
          }

          // Drawing No Search
          if (dwgSearch) {
            const dwgVal = String(r.drawing_no || r.Drawing_no || '').toLowerCase();
            if (!dwgVal.includes(dwgSearch)) return false;
          }

          // QA/QC Filters
          if (activeSource === 'qaqc') {
            if (qJoint && String(r.joint_type || '').toUpperCase() !== qJoint.toUpperCase()) return false;
            if (qWelder && !String(r.welder_no || '').includes(qWelder)) return false;
            if (qNdt === 'cleared' && !r.ndt_clearance) return false;
            if (qNdt === 'pending' && r.ndt_clearance) return false;
          }

          // Mech Filters
          if (activeSource === 'mech') {
            if (qDisp === 'dispatched' && !r.Fd_date) return false;
            if (qDisp === 'shop' && r.Fd_date) return false;
            if (qSize && !String(r.Spool_size || '').toLowerCase().includes(qSize)) return false;
          }

          // Mat Filters
          if (activeSource === 'mat') {
            if (qMin && !String(r.MIN_No || '').toLowerCase().includes(qMin)) return false;
            if (qSap && !String(r.MAT_SAP_CODE || '').toLowerCase().includes(qSap)) return false;
            if (qMatBal === 'pending') {
              const mq = parseNum(r.MIN_qty);
              const iq = parseNum(r.Issued_qty);
              if (iq >= mq) return false;
            } else if (qMatBal === 'issued') {
              const mq = parseNum(r.MIN_qty);
              const iq = parseNum(r.Issued_qty);
              if (iq < mq || mq === 0) return false;
            }
          }

          return true;
        });

        // Selected Columns
        const selectedColsKeys = Array.from(document.querySelectorAll('#columnsContainer input[type="checkbox"]:checked')).map(cb => cb.value);
        if (selectedColsKeys.length === 0) {
          throw new Error("⚠️ કૃપા કરીને ઓછામાં ઓછી ૧ કૉલમ પસંદ કરો!");
        }

        const mode = document.querySelector('input[name="reportMode"]:checked').value;
        const thead = document.getElementById('reportTableHead');
        const tbody = document.getElementById('reportTableBody');

        if (mode === 'detail') {
          renderDetailedReport(filtered, selectedColsKeys);
        } else {
          const groupKey = document.getElementById('selectGroupBy').value;
          renderSummaryReport(filtered, groupKey, selectedColsKeys);
        }

        document.getElementById('outputCard').style.display = 'block';
        document.getElementById('btnExport').disabled = false;

      } catch (err) {
        console.error(err);
        alert(err.message);
      } finally {
        btn.innerText = "⚡ Generate Report";
        btn.disabled = false;
      }
    }

    // 7. RENDER DETAILED REPORT VIEW
    function renderDetailedReport(rows, selectedKeys) {
      const cfg = CONFIGS[activeSource];
      const activeCols = cfg.allCols.filter(c => selectedKeys.includes(c.key));
      generatedHeaders = ['Sr.', ...activeCols.map(c => c.title)];

      const thead = document.getElementById('reportTableHead');
      const tbody = document.getElementById('reportTableBody');

      thead.innerHTML = `<tr><th>Sr.</th>${activeCols.map(c => `<th>${c.title}</th>`).join('')}</tr>`;

      let sumInchDia = 0;
      let sumBendQty = 0;
      let sumMinQty = 0;
      let sumIssuedQty = 0;

      rows.forEach(r => {
        if (r.weld_inch_dia) sumInchDia += parseNum(r.weld_inch_dia);
        if (r.Bend_qty) sumBendQty += parseNum(r.Bend_qty);
        if (r.MIN_qty) sumMinQty += parseNum(r.MIN_qty);
        if (r.Issued_qty) sumIssuedQty += parseNum(r.Issued_qty);
      });

      // 🟢 1.125 ACCURACY PRESERVATION:
      sumInchDia = Math.round(sumInchDia * 1000) / 1000;

      generatedReportRows = rows.map((r, i) => {
        const rowVals = [i + 1];
        activeCols.forEach(c => {
          let v = r[c.key];
          if (c.isDate) v = formatDateDisplay(v);
          else if (c.isInchDia && v !== null && v !== undefined && String(v).trim() !== '') {
            const numVal = parseFloat(v);
            v = !isNaN(numVal) ? (Number.isInteger(numVal) ? numVal : numVal.toFixed(3)) : v;
          } else if (v === null || v === undefined) v = '-';
          rowVals.push(v);
        });
        return rowVals;
      });

      tbody.innerHTML = generatedReportRows.map(row => `
        <tr>
          ${row.map((cell, idx) => {
            const align = idx === 1 ? 'text-align:left;' : '';
            return `<td style="${align}">${cell}</td>`;
          }).join('')}
        </tr>
      `).join('');

      // Add Total Row
      const totalRowHtml = `
        <tr class="total-row">
          <td>TOTAL</td>
          ${activeCols.map(c => {
            if (c.isInchDia) return `<td>${Number.isInteger(sumInchDia) ? sumInchDia : sumInchDia.toFixed(3)}</td>`;
            if (c.key === 'Bend_qty') return `<td>${sumBendQty}</td>`;
            if (c.key === 'MIN_qty') return `<td>${sumMinQty.toFixed(2)}</td>`;
            if (c.key === 'Issued_qty') return `<td>${sumIssuedQty.toFixed(2)}</td>`;
            return `<td>-</td>`;
          }).join('')}
        </tr>
      `;
      tbody.innerHTML += totalRowHtml;

      // Stats Pill
      let statPills = `<span class="stat-pill">Total Records: ${rows.length}</span>`;
      if (sumInchDia > 0) statPills += `<span class="stat-pill">Total Inch Dia: ${sumInchDia.toFixed(3)}</span>`;
      if (sumBendQty > 0) statPills += `<span class="stat-pill">Total Bend Qty: ${sumBendQty}</span>`;
      if (sumMinQty > 0) statPills += `<span class="stat-pill">Total MIN Qty: ${sumMinQty.toFixed(2)}</span>`;
      document.getElementById('statsBarContainer').innerHTML = statPills;
    }

    // 8. RENDER SUMMARY / PIVOT VIEW
    function renderSummaryReport(rows, groupKey, selectedKeys) {
      const cfg = CONFIGS[activeSource];
      const groupCol = cfg.allCols.find(c => c.key === groupKey) || { title: groupKey };

      const groupMap = new Map();

      rows.forEach(r => {
        let gVal = r[groupKey];
        if (gVal === null || gVal === undefined || String(gVal).trim() === '') gVal = '(Blanks)';
        else gVal = String(gVal).trim();

        if (!groupMap.has(gVal)) {
          groupMap.set(gVal, { count: 0, inchDia: 0, bendQty: 0, minQty: 0, issuedQty: 0, extra: new Set() });
        }
        const item = groupMap.get(gVal);
        item.count++;

        if (r.weld_inch_dia) item.inchDia += parseNum(r.weld_inch_dia);
        if (r.Bend_qty) item.bendQty += parseNum(r.Bend_qty);
        if (r.MIN_qty) item.minQty += parseNum(r.MIN_qty);
        if (r.Issued_qty) item.issuedQty += parseNum(r.Issued_qty);
      });

      const thead = document.getElementById('reportTableHead');
      const tbody = document.getElementById('reportTableBody');

      let colsHeaders = ['Sr.', groupCol.title, 'Total Count'];
      if (activeSource === 'qaqc') colsHeaders.push('Total Inch Dia');
      if (activeSource === 'mech') colsHeaders.push('Total Bend Qty');
      if (activeSource === 'mat') colsHeaders.push('Total MIN Qty', 'Total Issued Qty', 'Balance Qty');

      generatedHeaders = colsHeaders;
      thead.innerHTML = `<tr>${colsHeaders.map(h => `<th>${h}</th>`).join('')}</tr>`;

      let totalCount = 0;
      let totalInch = 0;
      let totalBend = 0;
      let totalMin = 0;
      let totalIssued = 0;

      const sortedGroups = Array.from(groupMap.entries()).sort((a, b) => b[1].count - a[1].count);

      generatedReportRows = sortedGroups.map(([gVal, data], idx) => {
        totalCount += data.count;
        totalInch += data.inchDia;
        totalBend += data.bendQty;
        totalMin += data.minQty;
        totalIssued += data.issuedQty;

        const row = [idx + 1, gVal, data.count];
        if (activeSource === 'qaqc') row.push(Math.round(data.inchDia * 1000) / 1000);
        if (activeSource === 'mech') row.push(data.bendQty);
        if (activeSource === 'mat') {
          const bal = Math.round((data.minQty - data.issuedQty) * 100) / 100;
          row.push(data.minQty.toFixed(2), data.issuedQty.toFixed(2), bal.toFixed(2));
        }
        return row;
      });

      totalInch = Math.round(totalInch * 1000) / 1000;

      tbody.innerHTML = generatedReportRows.map(row => `
        <tr>
          ${row.map((cell, idx) => {
            const align = idx === 1 ? 'text-align:left;' : '';
            return `<td style="${align}"><b>${cell}</b></td>`;
          }).join('')}
        </tr>
      `).join('');

      // Add Total Row
      const totalRow = [
        'TOTAL',
        `${sortedGroups.length} Groups`,
        totalCount
      ];
      if (activeSource === 'qaqc') totalRow.push(Number.isInteger(totalInch) ? totalInch : totalInch.toFixed(3));
      if (activeSource === 'mech') totalRow.push(totalBend);
      if (activeSource === 'mat') {
        const totalBal = Math.round((totalMin - totalIssued) * 100) / 100;
        totalRow.push(totalMin.toFixed(2), totalIssued.toFixed(2), totalBal.toFixed(2));
      }

      tbody.innerHTML += `
        <tr class="total-row">
          ${totalRow.map(c => `<td>${c}</td>`).join('')}
        </tr>
      `;

      document.getElementById('statsBarContainer').innerHTML = `
        <span class="stat-pill">Total Groups: ${sortedGroups.length}</span>
        <span class="stat-pill">Total Items: ${totalCount}</span>
        ${totalInch > 0 ? `<span class="stat-pill">Total Inch Dia: ${totalInch.toFixed(3)}</span>` : ''}
      `;
    }

    // 9. EXPORT REPORT TO EXCEL (.XLSX)
    async function exportReportToExcel() {
      if (generatedReportRows.length === 0) return alert("⚠️ કોઈ રિપોર્ટ ડેટા ઉપલબ્ધ નથી!");

      const workbook = new ExcelJS.Workbook();
      const worksheet = workbook.addWorksheet('Custom_Report', {
        views: [{ state: 'frozen', ySplit: 1, showGridLines: true }]
      });

      // Header Row
      const headerRow = worksheet.addRow(generatedHeaders);
      headerRow.height = 26;
      headerRow.eachCell(cell => {
        cell.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F172A' } };
        cell.alignment = { vertical: 'middle', horizontal: 'center' };
        cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'medium' }, right: { style: 'thin' } };
      });

      // Data Rows
      generatedReportRows.forEach(r => {
        const row = worksheet.addRow(r);
        row.height = 20;
        row.eachCell((cell, colIdx) => {
          cell.font = { name: 'Calibri', size: 10.5 };
          cell.border = {
            top: { style: 'thin', color: { argb: 'FFE2E8F0' } },
            left: { style: 'thin', color: { argb: 'FFE2E8F0' } },
            bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } },
            right: { style: 'thin', color: { argb: 'FFE2E8F0' } }
          };
          if (colIdx === 2) cell.alignment = { vertical: 'middle', horizontal: 'left' };
          else cell.alignment = { vertical: 'middle', horizontal: 'center' };
        });
      });

      // Auto-fit Column Widths
      worksheet.columns.forEach((col, idx) => {
        let maxLen = generatedHeaders[idx] ? generatedHeaders[idx].length : 12;
        generatedReportRows.slice(0, 100).forEach(r => {
          const v = String(r[idx] || '');
          if (v.length > maxLen) maxLen = v.length;
        });
        col.width = Math.min(Math.max(maxLen + 4, 12), 40);
      });

      const today = new Date().toISOString().split('T')[0];
      const fileName = `${CONFIGS[activeSource].table}_Custom_Report_${today}.xlsx`;

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (verifyAdminAccess()) {
        switchSource('qaqc');
      }
    });
  </script>
