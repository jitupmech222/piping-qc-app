<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mechanical Workflows | Piping Console</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #0b1329;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --teal: #0d9488;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: #f8fafc;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TOP NAVBAR */
    .top-navbar {
      background: var(--navy);
      color: #ffffff;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    .top-navbar-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back-nav {
      background: #ffffff;
      color: var(--navy);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-back-nav:hover { background: #f1f5f9; color: var(--teal); }

    /* WORKSPACE */
    .main-workspace {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      padding: 20px 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
      margin-top: 10px;
    }

    label { font-size: 12.5px; font-weight: 600; color: #334155; margin-top: 8px; display: block; }
    input, select {
      width: 100%;
      padding: 10px 14px;
      margin-top: 4px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13px;
      background: #fff;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    .btn-hero-action {
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-hero-action:hover { opacity: 0.9; }

    /* PREVIOUS SUB-MENU GRID & SUB-BTN LOOK */
    .sub-menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .sub-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      transition: 0.2s;
      text-align: left;
    }
    .sub-btn:hover {
      background: #f0fdfa;
      border-color: #5eead4;
      color: #0f766e;
      transform: translateY(-1px);
    }

    .btn-save-action {
      background: #15803d;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-save-action:hover { background: #166534; }

    .btn-add-queue {
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13.5px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn-add-queue:hover { background: #0f766e; }

    /* TABLES */
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; text-align: left; }
    th, td { border: 1px solid #e2e8f0; padding: 9px 12px; white-space: nowrap; }
    th { background: #0f172a; color: white; font-weight: 700; text-align: center; }
    tr:nth-child(even) td { background-color: #f8fafc; }
    td { text-align: center; }

    @media (max-width: 768px) {
      .sub-menu-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- TOP NAVBAR -->
  <header class="top-navbar">
    <div class="top-navbar-title">
      <span>⚙️</span>
      <span>MECHANICAL WORKFLOWS CONSOLE</span>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span id="userSessionTag" style="font-size:12px; color:#94a3b8; font-weight:bold;"></span>
      <a href="index.html" class="btn-back-nav">⬅️ Back to Dashboard</a>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="main-workspace">

    <!-- 1. SUB-PANEL: Mechanical (PREVIOUS EXACT LOOK) -->
    <div id="mechHub">
      <div class="card" style="margin-top:0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h3 style="margin:0; font-size:18px; font-weight:800; color:#0f766e;">Mechanical Workflows</h3>
          <button class="btn-hero-action" onclick="window.location.href='index.html'">⬅️ Back to Dashboard</button>
        </div>

        <div class="sub-menu-grid">
          <button class="sub-btn" id="btn_bending_issue" onclick="openStage('bending_issue')">
            <span>01</span><span>Issued for Bending</span>
          </button>
          <button class="sub-btn" id="btn_bend_entry" onclick="openStage('bend_entry')">
            <span>02</span><span>Bend Completed</span>
          </button>
          <button class="sub-btn" id="btn_fitup_entry" onclick="openStage('fitup_entry')">
            <span>03</span><span>Fit Up Completed</span>
          </button>
          <button class="sub-btn" id="btn_weld_visual" onclick="openStage('weld_visual')">
            <span>04</span><span>Weld Visual Completed</span>
          </button>
          <button class="sub-btn" id="btn_ndt_clearance" onclick="openStage('ndt_clearance')">
            <span>05</span><span>NDT Clearance</span>
          </button>
          <button class="sub-btn" id="btn_fd" onclick="openStage('fd')">
            <span>06</span><span>FD & Dispatch DC No</span>
          </button>

          <button class="sub-btn" style="border-left: 4px solid #0d9488; font-weight: bold;" onclick="window.location.href='custom_report_Mechanical.html'">
            <span>⚡</span><span>Mechanical Custom Report</span>
          </button>
          <button class="sub-btn" style="grid-column: 1 / -1; justify-content:center; background:#fffbeb; color:#b45309;" onclick="window.location.href='spool_tracking.html'">
            <span>🔍</span><span>Open Spool Tracker Page</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 2. STAGE OPERATION SCREEN (PREVIOUS EXACT LOOK) -->
    <div id="stageContainer" style="display: none;">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 id="stageTitle" style="margin:0; font-size:17px; font-weight:800; color:#0f766e;">Stage Title</h3>
          <button class="btn-hero-action" style="padding:6px 14px;" onclick="backToMechMenu()">⬅️ Back to Mechanical</button>
        </div>

        <label id="spoolSearchLabel" style="margin-top:14px;">Spool Unique Number:</label>
        <div style="position:relative;">
          <input type="text" id="spoolSearch" placeholder="Type spool no..." oninput="handleSearchInput()" autocomplete="off">
          <div id="searchDropdown" style="position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #0d9488; border-radius:8px; max-height:200px; overflow-y:auto; z-index:100; display:none; box-shadow:0 8px 24px rgba(0,0,0,0.12);"></div>
        </div>

        <div id="itemEditForm" style="display:none; background:#f8fafc; border:1px solid #99f6e4; border-radius:10px; padding:14px; margin-top:10px;">
          <div style="font-weight: bold; color: #0f766e;">📝 Edit Details:</div>
          <div><label>Spool Unique No:</label><input type="text" id="form_spool_no" readonly style="background:#e2e8f0;"></div>
          <div><label>Drawing No:</label><input type="text" id="form_drawing_no" readonly style="background:#e2e8f0;"></div>
          <div id="dynamicFormFields"></div>
          <input type="hidden" id="form_item_id">
          <button type="button" class="btn-add-queue" onclick="confirmAddFormToQueue()">➕ Save to Selected List</button>
        </div>

        <div id="selectedCardArea" style="margin-top: 14px; background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 14px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-size: 14px; font-weight: bold; color: #0f172a;" id="queueHeading">Selected Spools (<span id="queueCount">0</span>)</span>
            <button type="button" class="btn-save-action" id="btnSaveAction" onclick="submitCurrentStage()">💾 <span id="btnSaveLabel">SAVE ENTRY</span></button>
          </div>
          <div id="customInputsArea" style="margin-bottom: 12px;"></div>
          <div style="border: 1px solid #0f172a; border-radius: 8px; overflow-x: auto;">
            <table style="width:100%; font-size:12px;">
              <thead id="selectedTableHead"></thead>
              <tbody id="selectedTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top: 12px;">
        <h3 style="margin: 0; font-size:15px; font-weight:800; color: #0f766e;">📋 BALANCE LIST (<span id="tableTotalCount">0</span>)</h3>
        <div style="overflow-x:auto; margin-top:10px; max-height:45vh; border:1px solid #e2e8f0; border-radius:8px;">
          <table>
            <thead>
              <tr style="background:#0f172a; color:white;">
                <th style="text-align:left;">Drawing No</th>
                <th>Spool Unique No</th>
                <th>Spool Size</th>
                <th>WELD ID</th>
                <th>BEND QTY</th>
              </tr>
            </thead>
            <tbody id="stageBalanceTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://khaevpfnwpxcpzhbnooy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4DvhZ0usZv6Jeayd5TOamA_gbQQJ8mt';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentStage = '';
    let selectedQueue = [];
    let cumulativeRows = [];

    function checkSessionAuth() {
      const sessionData = sessionStorage.getItem('piping_app_auth');
      if (!sessionData) {
        alert("⚠️ કૃપા કરીને પહેલા Login કરો!");
        window.location.href = 'index.html';
        return false;
      }
      currentUser = JSON.parse(sessionData);
      document.getElementById('userSessionTag').innerText = `User: ${currentUser.name}`;

      // Enforce Role Permissions for Stage Buttons
      const isAdmin = currentUser.username === 'admin';
      const allowedStages = currentUser.allowed || [];

      const stageButtons = {
        'bending_issue': 'btn_bending_issue',
        'bend_entry': 'btn_bend_entry',
        'fitup_entry': 'btn_fitup_entry',
        'weld_visual': 'btn_weld_visual',
        'ndt_clearance': 'btn_ndt_clearance',
        'fd': 'btn_fd'
      };

      Object.entries(stageButtons).forEach(([stageKey, btnId]) => {
        const btn = document.getElementById(btnId);
        if (btn) {
          if (isAdmin || allowedStages.includes('all') || allowedStages.includes(stageKey)) {
            btn.style.display = 'flex';
          } else {
            btn.style.display = 'none';
          }
        }
      });
      return true;
    }

    async function openStage(stage) {
      currentStage = stage;
      selectedQueue = [];
      document.getElementById('mechHub').style.display = 'none';
      document.getElementById('itemEditForm').style.display = 'none';
      document.getElementById('stageContainer').style.display = 'block';

      setupStageUI(stage);
      renderSelectedTable();
      await loadStageData(stage);
    }

    function backToMechMenu() {
      document.getElementById('stageContainer').style.display = 'none';
      document.getElementById('mechHub').style.display = 'block';
    }

    function setupStageUI(stage) {
      const title = document.getElementById('stageTitle');
      const customArea = document.getElementById('customInputsArea');
      const btnSaveLabel = document.getElementById('btnSaveLabel');
      customArea.innerHTML = '';

      if (stage === 'bending_issue') {
        title.innerText = '1. ISSUED FOR BENDING ENTRY';
        btnSaveLabel.innerText = 'SAVE BENDING ENTRY';
        customArea.innerHTML = `<label>Bending Issue Date:</label><input type="date" id="input_date" required>`;
      } else if (stage === 'bend_entry') {
        title.innerText = '2. BEND ENTRY MODULE';
        btnSaveLabel.innerText = 'SAVE BEND ENTRY';
        customArea.innerHTML = `<label>Bend Date:</label><input type="date" id="input_date" required>`;
      } else if (stage === 'fitup_entry') {
        title.innerText = '3. FIT UP COMPLETED MODULE';
        btnSaveLabel.innerText = 'SAVE FIT-UP COMPLETED';
        customArea.innerHTML = `<label>Fit-Up Date:</label><input type="date" id="input_date" required>`;
      } else if (stage === 'weld_visual') {
        title.innerText = '4. WELD VISUAL COMPLETED MODULE';
        btnSaveLabel.innerText = 'SAVE VISUAL COMPLETED';
        customArea.innerHTML = `<label>Visual Date:</label><input type="date" id="input_date" required>`;
      } else if (stage === 'ndt_clearance') {
        title.innerText = '5. NDT CLEARANCE MODULE';
        btnSaveLabel.innerText = 'SAVE NDT ENTRY';
        customArea.innerHTML = `<label>NDT Clearance Date:</label><input type="date" id="input_date" required>`;
      } else if (stage === 'fd') {
        title.innerText = '6. FINAL DISPATCH & DC NO MODULE';
        btnSaveLabel.innerText = 'SAVE DC ENTRY';
        customArea.innerHTML = `<label>DC No:</label><input type="text" id="input_dc_no" required><label>Dispatch Date:</label><input type="date" id="input_date" required>`;
      }
    }

    async function loadStageData(stage) {
      let query = db.from('piping_joints').select('*');
      if (stage === 'bending_issue') query = query.is('Bend_date', null).is('Issued_for_bending', null);
      else if (stage === 'bend_entry') query = query.is('Bend_date', null).not('Issued_for_bending', 'is', null);
      else if (stage === 'fitup_entry') query = query.not('Bend_date', 'is', null).is('Fit_up_date', null);
      else if (stage === 'weld_visual') query = query.not('Fit_up_date', 'is', null).is('Weld_visual_date', null);
      else if (stage === 'ndt_clearance') query = query.not('Weld_visual_date', 'is', null).is('Ndt_clearance', null);
      else if (stage === 'fd') query = query.not('Ndt_clearance', 'is', null).is('Fd_date', null);

      const { data } = await query.order('id', { ascending: true }).limit(2000);
      cumulativeRows = data || [];
      renderBalanceTable();
    }

    function renderBalanceTable() {
      document.getElementById('tableTotalCount').innerText = cumulativeRows.length;
      const tbody = document.getElementById('stageBalanceTableBody');
      if (cumulativeRows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding:20px; color:#15803d; font-weight:bold;">0 Spools Balance for this stage!</td></tr>`;
        return;
      }
      tbody.innerHTML = cumulativeRows.slice(0, 300).map(r => `
        <tr>
          <td style="text-align:left;"><b>${r.Drawing_no || '-'}</b></td>
          <td><b>${r.Spool_number || '-'}</b></td>
          <td>${r.Spool_size || '-'}</td>
          <td><b>${r.Weld_id || '-'}</b></td>
          <td>${r.Bend_qty || '-'}</td>
        </tr>
      `).join('');
    }

    function handleSearchInput() {
      const term = document.getElementById('spoolSearch').value.trim().toLowerCase();
      const drop = document.getElementById('searchDropdown');
      if (!term) { drop.style.display = 'none'; return; }

      const matched = cumulativeRows.filter(r => String(r.Spool_number || '').toLowerCase().includes(term)).slice(0, 20);
      if (matched.length === 0) {
        drop.innerHTML = '<div style="padding:10px; color:#64748b; font-size:12px;">No Spool Found</div>';
        drop.style.display = 'block';
        return;
      }

      drop.innerHTML = matched.map(r => `
        <div style="padding:8px 12px; cursor:pointer; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center;" onclick="onSpoolSelect(${r.id})">
          <b>${r.Spool_number}</b> <span style="font-size:11.5px; color:#64748b;">(${r.Drawing_no})</span>
        </div>
      `).join('');
      drop.style.display = 'block';
    }

    function onSpoolSelect(id) {
      const item = cumulativeRows.find(x => x.id === id);
      if (!item) return;
      document.getElementById('spoolSearch').value = '';
      document.getElementById('searchDropdown').style.display = 'none';

      if (currentStage === 'bend_entry') {
        document.getElementById('itemEditForm').style.display = 'block';
        document.getElementById('form_item_id').value = item.id;
        document.getElementById('form_spool_no').value = item.Spool_number;
        document.getElementById('form_drawing_no').value = item.Drawing_no;
        document.getElementById('dynamicFormFields').innerHTML = `
          <label>Bend Qty:</label><input type="text" id="form_bend_qty" value="${item.Bend_qty || ''}">
          <label>Weld ID:</label><input type="text" id="form_weld_id" value="${item.Weld_id || ''}">
        `;
        return;
      }

      selectedQueue.push(item);
      renderSelectedTable();
    }

    function confirmAddFormToQueue() {
      const id = parseInt(document.getElementById('form_item_id').value);
      const item = cumulativeRows.find(x => x.id === id);
      if (!item) return;

      selectedQueue.push({
        ...item,
        final_bend_qty: document.getElementById('form_bend_qty').value.trim(),
        final_weld_id: document.getElementById('form_weld_id').value.trim()
      });

      document.getElementById('itemEditForm').style.display = 'none';
      renderSelectedTable();
    }

    function renderSelectedTable() {
      document.getElementById('queueCount').innerText = selectedQueue.length;
      const thead = document.getElementById('selectedTableHead');
      const tbody = document.getElementById('selectedTableBody');

      thead.innerHTML = `<tr><th>Sr.</th><th>Spool Unique No</th><th style="text-align:left;">Drawing No</th><th>Action</th></tr>`;
      
      if (selectedQueue.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:#64748b; padding:12px;">No spools selected in queue</td></tr>`;
        return;
      }

      tbody.innerHTML = selectedQueue.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><b>${r.Spool_number}</b></td>
          <td style="text-align:left;">${r.Drawing_no}</td>
          <td><button style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="selectedQueue.splice(${i},1); renderSelectedTable();">✕</button></td>
        </tr>
      `).join('');
    }

    async function submitCurrentStage() {
      if (selectedQueue.length === 0) return alert('ઓછામાં ઓછો ૧ Spool સિલેક્ટ કરો.');
      const date = document.getElementById('input_date') ? document.getElementById('input_date').value : null;

      if (currentStage === 'bending_issue') {
        if (!date) return alert('તારીખ દાખલ કરો');
        await db.from('piping_joints').update({ Issued_for_bending: date }).in('id', selectedQueue.map(x => x.id));
      } else if (currentStage === 'bend_entry') {
        if (!date) return alert('તારીખ દાખલ કરો');
        for (const item of selectedQueue) {
          await db.from('piping_joints').update({ Bend_date: date, Bend_qty: item.final_bend_qty, Weld_id: item.final_weld_id }).eq('id', item.id);
        }
      } else if (currentStage === 'fitup_entry') {
        if (!date) return alert('તારીખ દાખલ કરો');
        await db.from('piping_joints').update({ Fit_up_date: date }).in('id', selectedQueue.map(x => x.id));
      } else if (currentStage === 'weld_visual') {
        if (!date) return alert('તારીખ દાખલ કરો');
        await db.from('piping_joints').update({ Weld_visual_date: date }).in('id', selectedQueue.map(x => x.id));
      } else if (currentStage === 'ndt_clearance') {
        if (!date) return alert('તારીખ દાખલ કરો');
        await db.from('piping_joints').update({ Ndt_clearance: date }).in('id', selectedQueue.map(x => x.id));
      } else if (currentStage === 'fd') {
        const dcNo = document.getElementById('input_dc_no').value.trim();
        if (!dcNo || !date) return alert('DC No અને તારીખ બંને દાખલ કરો');
        await db.from('piping_joints').update({ Shift_dc_no: dcNo, Fd_date: date }).in('id', selectedQueue.map(x => x.id));
      }

      alert('સફળતાપૂર્વક સાચવવામાં આવ્યું!');
      selectedQueue = [];
      renderSelectedTable();
      loadStageData(currentStage);
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#spoolSearch') && !e.target.closest('#searchDropdown')) {
        const drop = document.getElementById('searchDropdown');
        if (drop) drop.style.display = 'none';
      }
    });

    window.addEventListener('DOMContentLoaded', checkSessionAuth);
  </script>
</body>
</html>
