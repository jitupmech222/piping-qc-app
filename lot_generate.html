<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lot Generate | QA/QC Module</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Client-side Excel generation library matching generate_lot.py -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding: 20px; -webkit-font-smoothing: antialiased; }

    .top-header {
      background: #ffffff;
      padding: 16px 22px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .top-header-left { display: flex; align-items: center; gap: 14px; }
    .top-header h2 { margin: 0; color: #17365d; font-size: 20px; font-weight: 800; }

    .btn-back {
      padding: 7px 15px;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-back:hover { background: #f1f5f9; }

    .main-card {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      padding: 26px 30px;
    }

    .form-group { margin-bottom: 22px; }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .radio-group {
      display: flex;
      gap: 24px;
      background: #f8fafc;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      width: fit-content;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      color: #334155;
    }
    .radio-label input[type="radio"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: #0284c7;
    }

    .input-lot {
      width: 100%;
      max-width: 320px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 600;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }
    .input-lot:focus { border-color: #0284c7; }

    .btn-generate {
      padding: 12px 28px;
      background: #17365d;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-generate:hover { background: #0f233d; }
    .btn-generate:disabled { background: #94a3b8; cursor: not-allowed; }

    .result-box {
      margin-top: 24px;
      padding: 18px 20px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.6;
    }
    .result-success { background: #dcfce7; color: #15803d; border: 1.5px solid #bbf7d0; }
    .result-error { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fecaca; font-weight: 600; }

    .preview-card {
      margin-top: 26px;
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      padding: 18px;
      display: none;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    th { background: #17365d; color: #fff; padding: 8px; border: 1px solid #cbd5e1; font-weight: 700; text-align: center; }
    td { padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center; }
    tr:nth-child(even) td { background: #f8fafc; }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <div class="top-header">
    <div class="top-header-left">
      <a href="index.html?tab=qaqc" class="btn-back">⬅️ Back to QA/QC</a>
      <h2>⚙️ LOT GENERATE MODULE</h2>
      <span id="navSubTitle" style="font-size: 12px; color: #64748b; font-weight: bold;"></span>
    </div>
  </div>

  <!-- MAIN GENERATE CARD -->
  <div class="main-card">
    <!-- 1. NDT TYPE -->
    <div class="form-group">
      <label>1. Select NDT Type:</label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="ndtType" value="RT" checked onchange="updatePlaceholder()">
          ☢️ RT (Radiography)
        </label>
        <label class="radio-label">
          <input type="radio" name="ndtType" value="DPT" onchange="updatePlaceholder()">
          🔬 DPT (Penetrant)
        </label>
      </div>
    </div>

    <!-- 2. LOT NUMBER INPUT -->
    <div class="form-group">
      <label id="lblLotInput">2. Enter RT Lot Number:</label>
      <input
        type="text"
        id="inputLotNo"
        class="input-lot"
        placeholder="e.g. 01, 101, PJ-01"
        autocomplete="off"
        onkeydown="if(event.key === 'Enter') handleGenerateLot()"
      />
    </div>

    <!-- ACTION BUTTON -->
    <button type="button" id="btnGen" class="btn-generate" onclick="handleGenerateLot()">
      📑 Generate & Download LOT Master Excel
    </button>

    <!-- STATUS ALERT -->
    <div id="statusAlert" style="display: none;"></div>

    <!-- PREVIEW TABLE -->
    <div id="previewCard" class="preview-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h4 style="margin: 0; color: #17365d;" id="previewHeading">Preview Joints</h4>
        <span style="font-size: 12px; color: #16a34a; font-weight: 700;">✓ Formatted as LOT MASTER.xlsx</span>
      </div>
      <div style="overflow-x: auto; max-height: 320px;">
        <table>
          <thead>
            <tr>
              <th>Sr.</th>
              <th>Drawing No</th>
              <th>Pipe Class</th>
              <th>Joint No</th>
              <th>Size & Thk</th>
              <th>Welder</th>
              <th>Type</th>
              <th>Visual Rep No</th>
              <th>Visual Date</th>
              <th>NDT Rep No (XR No)</th>
              <th>NDT Date</th>
              <th>Spool No</th>
              <th>NDT Clearance</th>
            </tr>
          </thead>
          <tbody id="previewTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://khaevpfnwpxcpzhbnooy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4DvhZ0usZv6Jeayd5TOamA_gbQQJ8mt';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function verifyAdminAccess() {
      const sessionData = sessionStorage.getItem('piping_app_auth');
      if (!sessionData) {
        alert("⚠️ કૃપા કરીને પહેલા Login કરો!");
        window.location.href = 'index.html';
        return false;
      }
      const user = JSON.parse(sessionData);
      if (user.username !== 'admin') {
        alert("⚠️ Access Denied: માત્ર Admin પાસે જ Lot Generate ની પરમિશન છે!");
        window.location.href = 'index.html?tab=qaqc';
        return false;
      }
      document.getElementById('navSubTitle').innerText = `| Admin: ${user.name}`;
      return true;
    }

    function updatePlaceholder() {
      const type = document.querySelector('input[name="ndtType"]:checked').value;
      document.getElementById('lblLotInput').innerText = `2. Enter ${type} Lot Number:`;
      document.getElementById('inputLotNo').placeholder = type === 'RT' ? 'e.g. 01, 101, PJ-01' : 'e.g. 02, 03, 700';
    }

    function extractCleanLotNum(val) {
      if (val === null || val === undefined) return "";
      const str = String(val).trim();
      if (!str || ["NA", "0", "NULL", "UNDEFINED"].includes(str.toUpperCase())) return "";
      const upper = str.toUpperCase().replace(/\s+/g, '');
      if (upper.includes("PJ-01") || upper.includes("PJ1") || upper.includes("PJ-1")) return "PJ-01";
      if (upper.includes("PJ-02") || upper.includes("PJ2") || upper.includes("PJ-2")) return "PJ-02";
      return str;
    }

    function formatDateDisplay(val) {
      if (!val) return '';
      const str = String(val).trim();
      if (!str || str.toLowerCase() === 'null' || str.toUpperCase() === 'NA') return '';
      const dPart = str.includes('T') ? str.split('T')[0] : str;
      const parts = dPart.split('-');
      if (parts.length === 3 && parts[0].length === 4) return `${parts[2]}-${parts[1]}-${parts[0]}`;
      return str;
    }

    function percentText(val) {
      if (!val) return "";
      const str = String(val).trim();
      if (str.endsWith("%")) return str;
      const n = parseFloat(str);
      if (!isNaN(n)) {
        return n <= 1 ? `${Math.round(n * 100)}%` : `${Math.round(n)}%`;
      }
      return str;
    }

    // 🟢 MAIN GENERATE FUNCTION (Mirror of generate_lot.py)
    async function handleGenerateLot() {
      const ndtType = document.querySelector('input[name="ndtType"]:checked').value;
      const rawLot = document.getElementById('inputLotNo').value.trim();

      const alertBox = document.getElementById('statusAlert');
      const previewCard = document.getElementById('previewCard');
      alertBox.style.display = 'none';
      previewCard.style.display = 'none';

      if (!rawLot) {
        alert("⚠️ મહેરબાની કરીને Lot Number દાખલ કરો!");
        document.getElementById('inputLotNo').focus();
        return;
      }

      const btnGen = document.getElementById('btnGen');
      btnGen.disabled = true;
      btnGen.innerText = "⏳ Generating Excel...";

      try {
        // ૧. તમામ ડેટા Supabase (lhs_entries) માંથી ખેંચવો
        let allRows = [];
        let from = 0;
        let hasMore = true;

        while (hasMore) {
          const { data, error } = await db
            .from('lhs_entries')
            .select('*')
            .order('id', { ascending: true })
            .range(from, from + 999);

          if (error) throw error;
          if (data && data.length > 0) {
            allRows = allRows.concat(data);
            from += 1000;
            if (data.length < 1000) hasMore = false;
          } else {
            hasMore = false;
          }
        }

        const targetLotClean = extractCleanLotNum(rawLot).toUpperCase();
        let matchedJoints = [];
        let headerNdt = "";
        let headerWps = "";

        // ================= RT LOGIC (Col AL in Python) =================
        if (ndtType === "RT") {
          matchedJoints = allRows.filter(r => {
            const lotVal = extractCleanLotNum(r.rt_lot_no).toUpperCase();
            if (!lotVal) return false;
            return lotVal === targetLotClean ||
                   (parseInt(lotVal, 10) === parseInt(targetLotClean, 10) && !isNaN(parseInt(targetLotClean, 10)));
          });

          if (matchedJoints.length === 0) {
            throw new Error(`RT LOT NO "${rawLot}" lhs_entries માં મળ્યો નથી.`);
          }

          const rtValues = [...new Set(matchedJoints.map(r => percentText(r.rt_percentage)).filter(Boolean))].sort();
          const wpsValues = [...new Set(matchedJoints.map(r => String(r.wps_no || '').trim()).filter(Boolean))].sort();

          headerNdt = "RT-" + (rtValues.length > 0 ? rtValues.join(" & ") : "100%");
          headerWps = "WPS-" + (wpsValues.length > 0 ? wpsValues.join(" & ") : "NA");

        // ================= DPT LOGIC (Auto-detect AF / T in Python) =================
        } else {
          // ૧. પહેલા dpt_lot_no (Col AF) માં ચેક કરવું
          matchedJoints = allRows.filter(r => {
            const lotVal = extractCleanLotNum(r.dpt_lot_no).toUpperCase();
            if (!lotVal) return false;
            return lotVal === targetLotClean ||
                   (parseInt(lotVal, 10) === parseInt(targetLotClean, 10) && !isNaN(parseInt(targetLotClean, 10)));
          });

          if (matchedJoints.length > 0) {
            const dptValues = [...new Set(matchedJoints.map(r => percentText(r.dpt_percentage)).filter(Boolean))].sort();
            const wpsValues = [...new Set(matchedJoints.map(r => String(r.wps_no || '').trim()).filter(Boolean))].sort();

            headerNdt = "DPT-" + (dptValues.length > 0 ? dptValues.join(" & ") : "100%");
            headerWps = "WPS-" + (wpsValues.length > 0 ? wpsValues.join(" & ") : "NA");
          } else {
            // ૨. જો dpt_lot_no માં ન મળે તો induction_bend_dpt_lot_no (Col T - EB) માં ચેક કરવું
            matchedJoints = allRows.filter(r => {
              const lotVal = extractCleanLotNum(r.induction_bend_dpt_lot_no).toUpperCase();
              if (!lotVal) return false;
              return lotVal === targetLotClean ||
                     (parseInt(lotVal, 10) === parseInt(targetLotClean, 10) && !isNaN(parseInt(targetLotClean, 10)));
            });

            if (matchedJoints.length === 0) {
              throw new Error(`DPT LOT NO "${rawLot}" dpt_lot_no અથવા induction_bend_dpt_lot_no માં મળ્યો નથી.`);
            }

            headerNdt = "DPT-10%";
            headerWps = "WPS-NA";
          }
        }

        // ================= CREATE LOT MASTER WORKBOOK =================
        const workbook = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet(ndtType, {
          views: [{ showGridLines: true }]
        });

        const centerStyle = { vertical: 'middle', horizontal: 'center' };
        const borderStyle = {
          top: { style: 'thin', color: { argb: 'FFCBD5E1' } },
          left: { style: 'thin', color: { argb: 'FFCBD5E1' } },
          bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } },
          right: { style: 'thin', color: { argb: 'FFCBD5E1' } }
        };

        // Title Rows
        worksheet.mergeCells('A1:Q2');
        const cTitle = worksheet.getCell('A1');
        cTitle.value = "LOT MASTER - NDT INSPECTION RECORD";
        cTitle.font = { name: 'Calibri', size: 14, bold: true, color: { argb: 'FFFFFFFF' } };
        cTitle.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF17365D' } };
        cTitle.alignment = centerStyle;

        // Header Row 4 (WPS, NDT, LOT NAME as in Python)
        worksheet.getCell('D4').value = headerWps;
        worksheet.getCell('I4').value = headerNdt;
        worksheet.getCell('N4').value = `LOT NAME: MPL/AIPL/${ndtType}/LOT-${rawLot}`;

        ['D4', 'I4', 'N4'].forEach(pos => {
          const c = worksheet.getCell(pos);
          c.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FF0F172A' } };
          c.alignment = centerStyle;
        });

        // Lot No Cell G7
        worksheet.getCell('G7').value = isNaN(parseInt(rawLot, 10)) ? rawLot : parseInt(rawLot, 10);
        worksheet.getCell('G7').font = { name: 'Calibri', size: 11, bold: true };
        worksheet.getCell('G7').alignment = centerStyle;

        // Table Headers (Row 6)
        const colHeaders = [
          "Sr", "Drawing No", "", "Pipe Class", "Joint No", "Size & Thk", "",
          "Welder No", "Type", "", "Weld Visual Report No", "Visual Date",
          "Type of NDT", "NDT Report No", "NDT Date", "Spool No", "NDT Clearance"
        ];
        const hRow = worksheet.getRow(6);
        hRow.values = colHeaders;
        hRow.height = 24;
        hRow.eachCell((cell) => {
          cell.font = { name: 'Calibri', size: 10.5, bold: true, color: { argb: 'FFFFFFFF' } };
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F766E' } };
          cell.alignment = centerStyle;
        });

        // Data Rows starting from Row 7
        let rowOut = 7;
        let sr = 1;
        let lastSpool = null;

        matchedJoints.forEach(j => {
          const jType = String(j.joint_type || '').toUpperCase().trim();
          const isBW = jType === 'BW';

          let reportNo = "";
          let ndtDate = "";
          let xrNo = "";

          if (ndtType === "RT") {
            reportNo = (j.rt_report_no && j.rt_report_no !== 'NA') ? j.rt_report_no : "";
            ndtDate = formatDateDisplay(j.rt_date);
            xrNo = (j.xr_no && j.xr_no !== 'NA') ? j.xr_no : "";
          } else {
            if (jType === 'EB') {
              reportNo = (j.induction_bend_dpt_report_no && j.induction_bend_dpt_report_no !== 'NA') ? j.induction_bend_dpt_report_no : "";
              ndtDate = formatDateDisplay(j.induction_bend_dpt_date);
            } else {
              reportNo = (j.dpt_report_no && j.dpt_report_no !== 'NA') ? j.dpt_report_no : "";
              ndtDate = formatDateDisplay(j.dpt_date);
            }
          }

          const repDisplay = (reportNo && xrNo) ? `${reportNo} (${xrNo})` : reportNo;
          const sizeThk = (j.weld_npd && j.thk) ? `${j.weld_npd}"/${j.thk}` : (j.weld_npd ? `${j.weld_npd}"` : (j.thk || "-"));

          worksheet.getCell(`A${rowOut}`).value = sr;
          worksheet.getCell(`B${rowOut}`).value = j.drawing_no || '';
          worksheet.getCell(`D${rowOut}`).value = j.pipe_class || '';
          worksheet.getCell(`E${rowOut}`).value = j.joint_no || '';
          worksheet.getCell(`F${rowOut}`).value = sizeThk;
          worksheet.getCell(`H${rowOut}`).value = j.welder_no || 'NA';
          worksheet.getCell(`I${rowOut}`).value = jType;
          worksheet.getCell(`K${rowOut}`).value = j.weld_visual_report_no || '';
          worksheet.getCell(`L${rowOut}`).value = formatDateDisplay(j.visual_date);
          worksheet.getCell(`M${rowOut}`).value = isBW ? "RT" : "DPT";
          worksheet.getCell(`N${rowOut}`).value = repDisplay;
          worksheet.getCell(`O${rowOut}`).value = ndtDate;
          worksheet.getCell(`Q${rowOut}`).value = formatDateDisplay(j.ndt_clearance);

          const currentSpool = j.spool_no || '';
          if (currentSpool !== lastSpool) {
            worksheet.getCell(`P${rowOut}`).value = currentSpool;
            lastSpool = currentSpool;
          }

          "ABCDEFHIJKLMNOPQ".split("").forEach(col => {
            const c = worksheet.getCell(`${col}${rowOut}`);
            c.font = { name: 'Calibri', size: 10 };
            c.alignment = col === 'B' ? { vertical: 'middle', horizontal: 'left' } : centerStyle;
            c.border = borderStyle;
          });

          rowOut++;
          sr++;
        });

        // Column Widths
        worksheet.columns = [
          { key: 'A', width: 6 },
          { key: 'B', width: 28 },
          { key: 'C', width: 4 },
          { key: 'D', width: 14 },
          { key: 'E', width: 10 },
          { key: 'F', width: 14 },
          { key: 'G', width: 8 },
          { key: 'H', width: 12 },
          { key: 'I', width: 10 },
          { key: 'J', width: 4 },
          { key: 'K', width: 18 },
          { key: 'L', width: 13 },
          { key: 'M', width: 12 },
          { key: 'N', width: 18 },
          { key: 'O', width: 13 },
          { key: 'P', width: 16 },
          { key: 'Q', width: 14 }
        ];

        // ૪. Auto Download
        const fileName = `${ndtType}_LOT_${rawLot}.xlsx`;
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);

        // ૫. UI Success
        alertBox.className = "result-box result-success";
        alertBox.innerHTML = `
          <h3 style="margin: 0 0 6px 0;">✅ LOT Excel સફળતાપૂર્વક તૈયાર થઈ ગઈ છે!</h3>
          <p style="margin: 2px 0;"><b>NDT Type:</b> ${ndtType} | <b>Lot No:</b> ${rawLot}</p>
          <p style="margin: 2px 0;"><b>Joints Count:</b> ${matchedJoints.length} જોઈન્ટ્સ મળ્યા</p>
          <p style="margin: 2px 0;"><b>Header NDT:</b> ${headerNdt} | <b>Header WPS:</b> ${headerWps}</p>
          <p style="margin: 2px 0;"><b>File Downloaded:</b> 📥 <u>${fileName}</u></p>
        `;
        alertBox.style.display = 'block';

        // Preview Table
        document.getElementById('previewHeading').innerText = `Preview: ${ndtType} LOT-${rawLot} (${matchedJoints.length} Joints)`;
        document.getElementById('previewTbody').innerHTML = matchedJoints.map((j, i) => {
          const jType = String(j.joint_type || '').toUpperCase().trim();
          const sizeThk = (j.weld_npd && j.thk) ? `${j.weld_npd}"/${j.thk}` : (j.weld_npd ? `${j.weld_npd}"` : (j.thk || "-"));
          let rep = ndtType === 'RT' ? (j.rt_report_no || '') : (jType === 'EB' ? j.induction_bend_dpt_report_no : j.dpt_report_no);
          if (ndtType === 'RT' && j.xr_no) rep += ` (${j.xr_no})`;
          const dt = ndtType === 'RT' ? j.rt_date : (jType === 'EB' ? j.induction_bend_dpt_date : j.dpt_date);

          return `
            <tr>
              <td>${i + 1}</td>
              <td style="text-align:left;">${j.drawing_no || '-'}</td>
              <td>${j.pipe_class || '-'}</td>
              <td><b>${j.joint_no}</b></td>
              <td>${sizeThk}</td>
              <td>${j.welder_no || 'NA'}</td>
              <td>${jType}</td>
              <td>${j.weld_visual_report_no || '-'}</td>
              <td>${formatDateDisplay(j.visual_date)}</td>
              <td>${rep || '-'}</td>
              <td>${formatDateDisplay(dt)}</td>
              <td><b>${j.spool_no || '-'}</b></td>
              <td>${formatDateDisplay(j.ndt_clearance)}</td>
            </tr>
          `;
        }).join('');
        previewCard.style.display = 'block';

      } catch (err) {
        console.error(err);
        alertBox.className = "result-box result-error";
        alertBox.innerHTML = `❌ ${err.message}`;
        alertBox.style.display = 'block';
      } finally {
        btnGen.disabled = false;
        btnGen.innerText = "📑 Generate & Download LOT Master Excel";
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (verifyAdminAccess()) {
        updatePlaceholder();
      }
    });
  </script>
</body>
</html>
